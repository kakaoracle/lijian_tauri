[package]
name = "moyu"
version = "1.0.0"
description = "moyu app rebuilt with Tauri"
authors = ["Developer"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "moyu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
minreq = { version = "2", default-features = false, features = ["https-rustls"] }
png = "0.17"
rand = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = ["protocol-asset", "unstable"] }
url = "2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = "z"
overflow-checks = false
panic = "abort"
split-debuginfo = "off"
strip = "symbols"
